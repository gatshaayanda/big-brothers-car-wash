name: The Plug pickup reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-plug-pickup-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production reminder endpoint
        env:
          BOEMO_REMINDER_CRON_SECRET: ${{ secrets.BOEMO_REMINDER_CRON_SECRET }}
          THE_PLUG_PUBLIC_URL: https://the-plug-pearl.vercel.app
        run: |
          test -n "$BOEMO_REMINDER_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $BOEMO_REMINDER_CRON_SECRET" \
            "$THE_PLUG_PUBLIC_URL/api/notifications/reminders"
